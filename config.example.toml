# XenoClaw configuration
# Copy to config.toml and fill in your values.
# Environment variable overrides use XENOCLAW_ prefix with __ for nesting.
# Example: XENOCLAW_LLM__PROVIDERS__0__API_KEY overrides llm.providers[0].api_key

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
[general]
agent_name = "xenoclaw"
data_dir   = "~/.xenoclaw/data"
log_dir    = "~/.xenoclaw/logs"

# ---------------------------------------------------------------------------
# LLM Providers (1–10 entries, ordered by priority — lowest number = first tried)
# ---------------------------------------------------------------------------
[[llm.providers]]
name          = "anthropic-primary"
provider_type = "anthropic"           # "anthropic" | "open_ai_compatible" | "ollama"
api_key       = ""                    # Set via XENOCLAW_LLM__PROVIDERS__0__API_KEY
base_url      = "https://api.anthropic.com"
model         = "claude-sonnet-4-20250514"
priority      = 1
timeout_seconds = 30
max_tokens    = 4096

# Uncomment to add a fallback Ollama provider:
# [[llm.providers]]
# name          = "ollama-fallback"
# provider_type = "ollama"
# api_key       = ""
# base_url      = "http://localhost:11434"
# model         = "llama3.2"
# priority      = 2
# timeout_seconds = 60

# NOTE: claude_code and copilot_cli provider types are text-only (no tool calling).
# For full tool support, use an API provider (anthropic, open_ai_compatible, ollama)
# and connect Claude Code / Copilot to XenoClaw via MCP:
#   xenoclaw mcp
# Then configure Claude Code with: claude mcp add xenoclaw -- xenoclaw mcp
#
# The following CLI providers are DEPRECATED and will be removed in a future release:

# [[llm.providers]]
# name          = "claude-code"
# provider_type = "claude_code"
# base_url      = ""
# model         = "claude-sonnet-4-20250514"
# priority      = 2
# timeout_seconds = 120

# [[llm.providers]]
# name          = "copilot"
# provider_type = "copilot_cli"
# base_url      = ""
# model         = "gpt-4o"
# priority      = 3
# timeout_seconds = 60

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
[security]
session_timeout_minutes = 30
max_failed_attempts     = 5
lockout_minutes         = 15

# Filesystem access rules (empty = no filesystem tool access)
# [[security.filesystem_rules]]
# path    = "/home/user/projects"
# read    = true
# write   = true
# execute = false

# Network access allowlist (empty = no outbound network tool access)
# [[security.network_allowlist]]
# host = "api.github.com"
# port = 443   # omit to allow all ports for this host

[security.resource_limits]
max_memory_mb    = 512
max_cpu_percent  = 80
max_processes    = 10

# ---------------------------------------------------------------------------
# Coding Module (comment out entire section to disable coding mode)
# ---------------------------------------------------------------------------
[coding]
workspace_dirs        = ["/var/lib/xenoclaw/workspace"]
repository_dirs       = ["/var/lib/xenoclaw/workspace"]
command_allowlist     = ["git", "cargo", "python3", "node", "npm", "bash", "sh", "make"]
command_blocklist     = []
max_file_size_mb      = 10
max_concurrent_shells = 5
shell_timeout_seconds = 300
undo_history_size     = 50

# ---------------------------------------------------------------------------
# Task Scheduler
# ---------------------------------------------------------------------------
[scheduler]
max_concurrent_tasks  = 10
default_timeout_seconds = 300
max_dependency_depth  = 10

# ---------------------------------------------------------------------------
# Web / Dashboard
# ---------------------------------------------------------------------------
[web]
enabled  = true
host     = "0.0.0.0"
port     = 8080
dir      = "/opt/xenoclaw/web"   # Directory containing built web UI files
# tls_cert = "/path/to/cert.pem"
# tls_key  = "/path/to/key.pem"

# ---------------------------------------------------------------------------
# API Server
# ---------------------------------------------------------------------------
[api]
host = "0.0.0.0"
port = 9090
rate_limit_per_minute = 100

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[plugins]
enabled = true
directory = "./plugins"
reload_interval_seconds = 10

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
[monitoring]
log_level            = "info"        # debug | info | warn | error | fatal
log_retention_days   = 30
max_log_file_size_mb = 100
metrics_enabled      = true
metrics_port         = 9100

# Alert rules (optional)
# [[monitoring.alert_rules]]
# name      = "high-error-rate"
# metric    = "error_count"
# threshold = 10.0
# operator  = "greater_than"

# ---------------------------------------------------------------------------
# Messaging (optional)
# ---------------------------------------------------------------------------
[messaging]
# [messaging.telegram]
# bot_token = ""

# [messaging.discord]
# bot_token = ""

# [messaging.whatsapp]
# phone_number = ""

# ---------------------------------------------------------------------------
# MCP (Model Context Protocol)
# ---------------------------------------------------------------------------
[mcp]
# XenoClaw as MCP server — exposes tools to Claude Code, Copilot, etc.
server_enabled = true
server_transport = "stdio"   # "stdio" (local) or "http" (remote/network)
server_port = 3100           # Only used if transport = "http"

# External MCP servers to connect to (XenoClaw as MCP client)
# [[mcp.servers]]
# name    = "filesystem"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-filesystem", "/home/user/projects"]

# [[mcp.servers]]
# name    = "github"
# command = "npx"
# args    = ["-y", "@modelcontextprotocol/server-github"]
# [mcp.servers.env]
# GITHUB_PERSONAL_ACCESS_TOKEN = ""
