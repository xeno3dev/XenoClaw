# XenoClaw Nginx site configuration (bare-metal / VPS)
#
# Install to: /etc/nginx/sites-available/xenoclaw
# Enable:     ln -s /etc/nginx/sites-available/xenoclaw /etc/nginx/sites-enabled/
#
# This config:
# - Serves the web UI static files from /opt/xenoclaw/web/
# - Proxies /api/ requests to the XenoClaw agent (localhost:9090)
# - Supports WebSocket connections for real-time chat
# - Handles SPA routing (all non-file routes → index.html)
#
# For HTTPS, run: sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name _;

    # Serve the web UI static files
    root /opt/xenoclaw/web;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Cache static assets (Vite uses hashed filenames — safe to cache forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — forward /api/ requests to XenoClaw agent
    location /api/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (required for /api/v1/ws/chat and /api/v1/ws/events)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;  # 24h — keeps WebSocket connections alive
    }

    # Prometheus metrics (restrict to localhost)
    location /metrics {
        proxy_pass http://127.0.0.1:9100/metrics;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # SPA fallback — serve index.html for all routes not matching a file
    # This handles client-side routing (/chat, /dashboard, /sessions, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
